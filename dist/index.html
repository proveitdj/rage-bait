<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Rage Bait, a trap-filled arcade platformer with unlimited retries.">
  <title>Rage Bait</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #171610;
      --shade: #201d16;
      --panel: #2d2619;
      --raised: #3b3020;
      --line: #544331;
      --frame: #785632;
      --amber: #ffc64f;
      --orange: #ff9956;
      --paper: #fff1d9;
      --muted: #c9b69a;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 14% 0%, #46321d 0%, transparent 46%),
        repeating-linear-gradient(135deg, #ffffff03 0 1px, transparent 1px 12px),
        var(--ink);
      color: var(--paper);
      font: 1rem system-ui, sans-serif;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, canvas:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 2px;
    }
    canvas:focus-visible { outline-offset: -3px; }
    header {
      border-bottom: 1px solid var(--line);
      background: #15130fed;
    }
    .bar, main { max-width: 1250px; margin: auto; padding-inline: 28px; }
    .bar {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      display: inline-flex;
      align-items: stretch;
      transform: skew(-6deg);
      background: var(--amber);
      border: 2px solid var(--amber);
      color: var(--ink);
      box-shadow: 3px 3px 0 #9d603d;
      font-family: Impact, "Arial Black", system-ui, sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-weight: 950;
      letter-spacing: -.035em;
      line-height: 1;
    }
    .brand strong, .brand span { padding: 6px 7px; }
    .brand span { background: var(--ink); color: var(--amber); }
    .tools { display: flex; gap: 8px; }
    .button {
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid var(--frame);
      border-bottom-width: 3px;
      border-radius: 5px;
      background: var(--panel);
      color: var(--paper);
      font-size: .875rem;
      font-weight: 700;
      line-height: 1;
    }
    .button:hover { background: var(--raised); border-color: var(--orange); }
    .button:active { transform: translateY(1px); }
    .tools button[aria-pressed=true] { color: var(--amber); }
    main { padding-block: 34px; }
    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px 22px;
      margin-bottom: 22px;
    }
    .stage {
      margin-bottom: 9px;
      color: var(--amber);
      font: 700 .875rem var(--mono);
      letter-spacing: .065em;
      line-height: 1.4;
    }
    h1 {
      margin: 0;
      color: var(--paper);
      text-wrap: balance;
      font-size: clamp(2rem, 6vw, 4.2rem);
      font-weight: 950;
      letter-spacing: -.063em;
      line-height: .98;
      text-shadow: 0 3px 0 #5c3b26;
    }
    .deaths {
      align-self: flex-end;
      flex: 0 0 auto;
      margin-bottom: 2px;
      padding: 7px 9px;
      border: 1px solid #94553d;
      border-radius: 4px;
      background: #351e17;
      color: #ffb393;
      font: 700 .875rem var(--mono);
      white-space: nowrap;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 256px;
      gap: 20px;
      align-items: start;
    }
    .screen {
      overflow: hidden;
      border: 1px solid var(--frame);
      border-top: 4px solid var(--orange);
      border-radius: 9px 9px 6px 6px;
      background: var(--shade);
      box-shadow: 0 5px 0 #100f0b, 0 16px 32px #100c075c;
    }
    .screenbar, .screenfoot {
      display: flex;
      align-items: center;
      gap: 8px 16px;
      padding: 10px 13px;
      color: var(--muted);
      font: 700 .875rem var(--mono);
      line-height: 1.4;
    }
    .screenbar { flex-wrap: wrap; }
    .screenbar #level, .screenbar .lives { color: var(--amber); }
    .screenbar #dangers { margin-left: auto; color: var(--orange); }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--line);
      touch-action: none;
    }
    .routebar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px 13px;
      border-bottom: 1px solid var(--line);
      color: var(--amber);
      font: 700 .8125rem var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .routebar:has(#route-progress:empty) { display: none; }
    #route-meter {
      appearance: none;
      width: 100%;
      height: 8px;
      overflow: hidden;
      border: 0;
      border-radius: 2px;
      background: var(--raised);
      color: var(--orange);
      accent-color: var(--orange);
    }
    #route-meter::-webkit-progress-bar {
      background: var(--raised);
    }
    #route-meter::-webkit-progress-value {
      background: linear-gradient(90deg, var(--orange), var(--amber));
    }
    #route-meter::-moz-progress-bar {
      background: linear-gradient(90deg, var(--orange), var(--amber));
    }
    .screenfoot {
      align-items: flex-start;
      min-height: 45px;
    }
    #status {
      order: -1;
      flex: 1 1 auto;
      color: var(--paper);
      font-family: system-ui, sans-serif;
      font-weight: 600;
    }
    #progress { flex: 0 0 auto; text-align: right; }
    .panel {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--shade);
      box-shadow: 0 4px 0 #100f0b;
    }
    .panel h2 {
      margin: 0 0 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--amber);
      font: 800 1rem var(--mono);
    }
    .stages { display: grid; gap: 5px; }
    .stage-button {
      display: grid;
      grid-template-columns: 2ch minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: var(--panel);
      color: var(--paper);
      text-align: left;
      font-size: .875rem;
      font-weight: 700;
    }
    .stage-button b { color: var(--orange); font: 700 .8125rem var(--mono); }
    .stage-button small { color: var(--muted); font: .8125rem var(--mono); }
    .stage-button:hover:not(:disabled) { border-color: var(--frame); }
    .stage-button[aria-current=true] {
      border-color: var(--orange);
      background: #48331c;
      color: var(--amber);
    }
    .stage-button:disabled { opacity: .55; cursor: default; }
    .levels { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 5px; }
    .level-button {
      width: 31px;
      min-height: 28px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--raised);
      font: 700 .8125rem var(--mono);
    }
    .level-button:hover:not(:disabled) { border-color: var(--orange); }
    .level-button[aria-current=true] {
      border-color: var(--amber);
      background: var(--amber);
      color: var(--ink);
    }
    .level-button:disabled { opacity: .4; cursor: default; }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 15px;
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--shade);
      color: var(--muted);
      font-size: .875rem;
    }
    .keys, .key-group { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .keys { column-gap: 15px; }
    .keys button { touch-action: none; }
    .controls kbd { font: 700 .875rem var(--mono); }
    .jump { color: var(--amber); }
    .shortcut kbd { color: var(--paper); }
    @media (max-width: 820px) {
      .bar, main { padding-inline: 17px; }
      main { padding-block: 26px; }
      .layout { grid-template-columns: minmax(0,1fr); }
      .stages { grid-template-columns: repeat(auto-fit, minmax(176px,1fr)); }
      .levels { grid-column: 1 / -1; }
    }
    @media (max-width: 480px) {
      .bar, main { padding-inline: 12px; }
      .bar { min-height: 60px; }
      .title-row { align-items: flex-start; flex-direction: column; margin-bottom: 14px; }
      .deaths { align-self: flex-start; }
      .screenbar, .screenfoot { font-size: .8125rem; gap: 6px 8px; padding-inline: 9px; }
      .routebar { gap: 8px; padding-inline: 9px; }
      .screenfoot { flex-wrap: wrap; }
      #status { flex-basis: 100%; }
      #progress { text-align: left; }
      .button { min-height: 44px; padding-inline: 8px; }
      .key-group .button { min-width: 44px; }
      .stages { grid-template-columns: repeat(auto-fit, minmax(145px,1fr)); }
      .stage-button { padding-inline: 6px; gap: 5px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand" aria-label="Rage Bait"><strong>RAGE</strong><span>BAIT</span></div>
      <div class="tools">
        <button type="button" id="sound" class="button" aria-pressed="false">Sound off</button>
        <button type="button" id="restart" class="button">Restart</button>
      </div>
    </div>
  </header>
  <main>
    <div class="title-row">
      <div>
        <div id="stage" class="stage"></div>
        <h1 id="title"></h1>
      </div>
      <div id="deaths" class="deaths"></div>
    </div>
    <div class="layout">
      <div>
        <section class="screen" aria-label="Game">
          <div class="screenbar">
            <span id="level"></span>
            <span id="dangers"></span>
            <span class="lives" aria-label="Unlimited lives">∞ LIVES</span>
          </div>
          <canvas id="game" width="864" height="460" tabindex="0" aria-label="Platform game. Use A and D to move, and Space to jump or swim."></canvas>
          <div class="routebar">
            <progress id="route-meter" max="1" value="0" aria-label="Ledge route progress"></progress>
            <span id="route-progress"></span>
          </div>
          <div class="screenfoot">
            <span id="status" role="status"></span>
            <span id="progress"></span>
          </div>
        </section>
        <div class="controls">
          <div class="keys">
            <div class="key-group">
              <button type="button" class="button" id="left" aria-label="Move left"><kbd>A / ←</kbd></button>
              <button type="button" class="button" id="right" aria-label="Move right"><kbd>D / →</kbd></button>
              <span>Move</span>
            </div>
            <div class="key-group">
              <button type="button" class="button jump" id="jump" aria-label="Jump or swim"><kbd>SPACE</kbd></button>
              <span>Jump / Swim</span>
            </div>
          </div>
          <span class="shortcut"><kbd>R</kbd> Restart</span>
        </div>
      </div>
      <aside class="panel" aria-labelledby="stages-heading">
        <h2 id="stages-heading">Stages</h2>
        <div class="stages" id="stages"></div>
      </aside>
    </div>
  </main>
  <script src="anthology-intro.js"></script><script src="anthology-a.js"></script><script src="anthology-b.js"></script><script src="endurance-routes.js"></script><script src="encounters.js"></script><script src="campaign-traps.js"></script><script src="objectives.js"></script><script src="anthology-art.js"></script><script src="retry-spikes.js"></script><script src="landforms.js"></script><script src="surprise-hazards.js"></script><script src="game.js"></script></body></html>
