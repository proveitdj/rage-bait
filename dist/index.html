<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Rage Bait, a trap-filled arcade platformer with unlimited retries."><title>Rage Bait</title>
<style>
:root{color-scheme:dark;--ink:#101015;--panel:#19191f;--line:#303036;--lime:#d8ff45;--muted:#aaa9b3;--pink:#ff5486}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#f7f6f9;font:16px system-ui,sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,canvas:focus-visible{outline:2px solid var(--lime);outline-offset:4px}header{border-bottom:1px solid var(--line)}.bar,main{max-width:1192px;margin:auto;padding-inline:24px}.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;font-size:25px;letter-spacing:-1.5px;font-style:italic}.brand span{color:var(--lime)}.tools{display:flex;gap:8px}.button{background:#222228;border:1px solid #37373f;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:700}.button:hover{border-color:var(--lime)}main{padding-block:34px}.title-row{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px}.stage{font:bold 13px ui-monospace,monospace;letter-spacing:2px;color:var(--lime)}h1{font-size:clamp(35px,6vw,60px);line-height:.98;letter-spacing:-.065em;margin:9px 0 0;font-weight:950}.deaths{font:700 14px ui-monospace,monospace;color:var(--pink);white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 258px;gap:18px;align-items:start}.screen,.panel,.controls{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.screenbar,.screenfoot{padding:11px 15px;display:flex;justify-content:space-between;gap:12px;font:700 12px ui-monospace,monospace;letter-spacing:1px;color:var(--muted)}.screenbar span:first-child{color:var(--lime)}canvas{display:block;width:100%;height:auto;touch-action:none}.screenfoot{min-height:40px;align-items:center}.screenfoot span:last-child{color:#e0dfea;letter-spacing:0}.panel{padding:16px}.panel h2{font-size:16px;margin:0 0 13px}.stages{display:grid;gap:6px}.stage-button{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;text-align:left;width:100%;background:#222229;border:1px solid transparent;border-radius:7px;padding:8px;font-size:13px;font-weight:700}.stage-button[aria-current=true]{border-color:#71832d;background:#2c3520;color:var(--lime)}.stage-button:disabled{opacity:.54;cursor:default}.stage-button small{font:12px ui-monospace,monospace;color:var(--muted)}.stage-button b{font:700 12px ui-monospace,monospace}.levels{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 5px}.level-button{border:1px solid #3b3c40;background:#26262d;border-radius:4px;font:12px ui-monospace,monospace;width:29px;height:26px}.level-button[aria-current=true]{background:var(--lime);color:#151719}.level-button:disabled{opacity:.35;cursor:default}.controls{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;color:var(--muted);font-size:13px}.keys{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.keys button{touch-action:none}kbd{font:700 12px ui-monospace,monospace}.jump{color:var(--lime)}@media(max-width:800px){.layout{grid-template-columns:1fr}.stages{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.levels{grid-column:1/-1}.bar,main{padding-inline:14px}.title-row{margin-bottom:16px}main{padding-block:24px}}@media(max-width:440px){.screenbar,.screenfoot{font-size:10px}.button{padding-inline:8px}}
</style></head>
<body><header><div class="bar"><div class="brand">RAGE <span>BAIT</span></div><div class="tools"><button id="sound" class="button" aria-pressed="false">Sound off</button><button id="restart" class="button">Restart</button></div></div></header>
<main><div class="title-row"><div><div id="stage" class="stage"></div><h1 id="title"></h1></div><div class="deaths" id="deaths"></div></div>
<div class="layout"><div><section class="screen" aria-label="Game"><div class="screenbar"><span id="level"></span><span>∞ LIVES</span></div><canvas id="game" width="864" height="460" tabindex="0" aria-label="Platform game. Use A and D to move, and Space to jump."></canvas><div class="screenfoot"><span id="progress"></span><span id="status" role="status"></span></div></section>
<div class="controls"><div class="keys"><button class="button" id="left" aria-label="Move left"><kbd>A / ←</kbd></button><button class="button" id="right" aria-label="Move right"><kbd>D / →</kbd></button> Move <button class="button jump" id="jump"><kbd>SPACE</kbd></button> Jump</div><span><kbd>R</kbd> Restart</span></div></div>
<aside class="panel"><h2>Stages</h2><div class="stages" id="stages"></div></aside></div></main>
<script src="game.js"></script></body></html>
